<script id="together-core">globalThis.TogetherDemo = (function createTogetherDemo() {
  const cards = [
    {id:"intro-01", title:"Замечать хорошее", time:"5 минут", prompt:"Какой небольшой поступок партнёра недавно сделал ваш день приятнее?", hint:"Вспомните конкретный момент. Одного-двух предложений достаточно.", action:"Прочитайте ответы и поблагодарите друг друга за эти моменты."},
    {id:"intro-02", title:"Забота на вашем языке", time:"7 минут", prompt:"Какое маленькое действие поможет вам почувствовать заботу на этой неделе?", hint:"Выберите что-то простое и посильное: прогулку, сообщение, помощь или время вместе.", action:"Выберите по одному действию из ответов и договоритесь, когда попробуете их."},
    {id:"intro-03", title:"Момент из нашей истории", time:"10 минут", prompt:"Какой момент из начала ваших отношений хочется сохранить?", hint:"Можно вспомнить встречу, разговор или небольшой смешной эпизод. Любой вопрос можно пропустить.", action:"Поделитесь воспоминаниями. Каждый может выбрать свой ответ для черновика книги."}
  ];
  const clone = s => JSON.parse(JSON.stringify(s));
  const member = (s, actor) => s.created && (actor === "a" || (actor === "b" && s.joined));
  const cardExists = id => cards.some(c => c.id === id);
  const invalidate = s => { s.revision++; s.approvals={a:null,b:null}; };
  const initial = () => ({created:false,joined:false,answers:{},completed:[],selections:{},revision:0,approvals:{a:null,b:null},paidStage:0,names:{a:"Анна",b:"Алексей"}});
  const create = s => ({...clone(s),created:true});
  const join = s => { if(!s.created) throw Error("Сначала создайте пространство."); return {...clone(s),joined:true}; };
  const submit = (s,id,actor,value) => {
    if(!member(s,actor)||!cardExists(id)) throw Error("Эта встреча сейчас недоступна.");
    if(typeof value!=="string"||!value.trim()||value.trim().length>1200) throw Error("Напишите ответ длиной от 1 до 1200 символов.");
    const n=clone(s); n.answers[id]??={}; n.answers[id][actor]=value.trim(); invalidate(n); return n;
  };
  const revealed = (s,id) => !!(s.joined && s.answers[id]?.a && s.answers[id]?.b);
  const visible = (s,id,actor) => {
    if(!member(s,actor)) return {a:null,b:null};
    const row=s.answers[id]??{};
    return {a:(actor==="a"||revealed(s,id))?row.a??null:null,b:(actor==="b"||revealed(s,id))?row.b??null:null};
  };
  const complete = (s,id) => {
    if(!cardExists(id)||!revealed(s,id)) throw Error("Дождитесь обоих ответов.");
    const n=clone(s); if(!n.completed.includes(id)) n.completed.push(id); return n;
  };
  const select = (s,id,actor) => {
    if(!member(s,actor)||!cardExists(id)||!revealed(s,id)) throw Error("Материал можно выбрать после раскрытия ответов.");
    const n=clone(s); const key=id+":"+actor; n.selections[key]=!n.selections[key]; invalidate(n); return n;
  };
  const materials = s => cards.flatMap(c=>["a","b"].flatMap(actor => s.selections[c.id+":"+actor]&&revealed(s,c.id)?[{id:c.id,actor,name:s.names[actor],prompt:c.prompt,text:s.answers[c.id][actor]}]:[]));
  const approve = (s,actor) => {
    if(!member(s,actor)||s.paidStage<3||!materials(s).length) throw Error("Для согласования нужны выбранные материалы и завершённый третий этап.");
    const n=clone(s); n.approvals[actor]=n.revision; return n;
  };
  const canPrint = s => s.joined&&s.paidStage>=3&&materials(s).length>0&&s.approvals.a===s.revision&&s.approvals.b===s.revision;
  const stage = (s,n) => {
    if(!s.created||!Number.isInteger(n)||n<0||n>12) throw Error("Недоступный демонстрационный этап.");
    return {...clone(s),paidStage:n};
  };
  return {cards,initial,create,join,submit,revealed,visible,complete,select,materials,approve,canPrint,stage};
})();</script><script>(function runTogetherPrototype() {
  "use strict";
  const D=globalThis.TogetherDemo;
  let state=D.initial(), actor="a", view="landing", cardId=D.cards[0].id;
  const root=document.getElementById("app"), notice=document.getElementById("notice");
  const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const button=(text,action,extra="",secondary=false)=>`<button type="button" class="button${secondary?" secondary":""}" data-action="${action}" ${extra}>${text}</button>`;
  const phases=[
    ["Больше внимания","Наши способы заботы"],["Узнавать друг друга заново","Первая глава"],["Мы команда","Книга о нас"],
    ["Романтика в обычной жизни","Наше меню свиданий"],["Новое вместе","Карта наших открытий"],["Наша следующая глава","Наше завтра"],
    ["Вместе и каждый по-своему","Наш удобный ритм"],["Поддержка в обычной жизни","Как быть рядом со мной"],["Снова находить друг друга","Наши опоры"],
    ["Мечтать вместе","Карта наших желаний"],["То, что хочется сохранить","Капсула времени"],["Наш год вдвоём","Годовое издание"]
  ];
  const symbol=`<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 88 28v44L50 94 12 72V28Z M50 6v88 M12 28l76 44 M88 28 12 72 M50 28 70 39v22L50 72 30 61V39Z" fill="none" stroke="currentColor" stroke-width="1"/></svg>`;
  function cover(small=false) {
    return `<div class="book-cover${small?" small":""}"><span class="eyebrow">Грани · Вдвоём</span>${symbol}<p class="cover-title">Книга<br>о нас</p><span class="cover-names">${esc(state.names.a)} и ${esc(state.names.b)}</span><span class="cover-bottom">История, которую создаём вместе</span></div>`;
  }
  function nav() {
    if(!state.created) return "";
    return `<nav class="tabs" aria-label="Разделы пространства">${[["home","Наше пространство"],["history","Наша история"],["roadmap","Наш год"]].map(([id,label])=>`<button type="button" data-action="view" data-view="${id}" aria-current="${view===id?"page":"false"}">${label}</button>`).join("")}</nav>`;
  }
  function landing() {
    return `<section class="hero"><div><p class="eyebrow">Грани. Вдвоём</p><h1 tabindex="-1">Ваши разговоры<br>становятся историей.</h1><p class="lead">Короткие встречи, идеи свиданий и маленькие открытия друг о друге. А выбранные воспоминания собираются в вашу личную книгу.</p><div class="actions">${button("Попробовать вдвоём →","create")}${button("Посмотреть встречу","sample","",true)}</div><p class="quiet">Три вводные встречи бесплатно · тест проходить необязательно</p></div><div class="cover-scene">${cover()}<span class="scene-note">Электронная книга после третьего оплаченного этапа</span></div></section>
    <section class="section"><p class="eyebrow">Одна встреча сегодня</p><h2>Начните с хорошего момента.</h2><div class="sample"><p class="question">${esc(D.cards[0].prompt)}</p><p>Каждый отвечает самостоятельно. Затем вы читаете ответы вместе и благодарите друг друга.</p>${button("Попробовать этот вопрос →","create")}</div></section>
    <section class="section"><div class="section-head"><div><p class="eyebrow">Путь вдвоём</p><h2>Каждый месяц — что-то своё.</h2></div><p class="quiet">Знакомство → воспоминания → опоры → планы</p></div><div class="three"><article class="panel"><span class="number">01</span><h3>Больше внимания</h3><p>Узнавайте, какие маленькие поступки помогают каждому чувствовать заботу.</p><p class="reward">Результат: ваши способы заботы</p></article><article class="panel"><span class="number">02</span><h3>Ваша общая история</h3><p>Сохраняйте воспоминания и слова друг о друге в будущую книгу.</p><p class="reward">После трёх этапов: «Книга о нас»</p></article><article class="panel"><span class="number">03</span><h3>Новые главы</h3><p>Пробуйте свидания, открытия и совместные планы в своём темпе.</p><p class="reward">Годовой путь с ежемесячными результатами</p></article></div></section>
    <section class="offer"><div><p class="eyebrow">Для двоих</p><h2>Одно пространство.<br>Ваш собственный ритм.</h2><p>Программа работает в браузере на телефоне и компьютере.</p></div><div><p class="price">599 ₽ <span>/ 30 дней</span></p><p class="quiet">Предварительная цена для прототипа. Оплаты в демо нет.</p>${button("Начать бесплатно →","create")}</div></section>`;
  }
  function home() {
    if(!state.joined) return `<section class="section narrow"><p class="eyebrow">Первый шаг</p><h1 tabindex="-1">Пригласите друг друга.</h1><p class="lead">Пространство уже создано. Алексей сможет принять приглашение и отвечать со своего аккаунта.</p><div class="panel"><h3>Ваше приглашение</h3><p>«Давай попробуем короткую встречу вдвоём? Первый вопрос займёт около пяти минут».</p><p class="quiet">В прототипе приглашение моделируется переключением участника. Реальная ссылка появится после подключения сервера.</p>${actor==="b"?button("Принять приглашение →","join"):button("Посмотреть со стороны Алексея →","switch","data-actor=\"b\"")}</div>${actor==="a"?`<div class="actions">${button("Подготовить свой ответ","activity",`data-id="${D.cards[0].id}"`,"secondary")}</div>`:""}</section>`;
    const next=D.cards.find(c=>!state.completed.includes(c.id));
    return `<section class="welcome"><div><p class="eyebrow">${esc(state.names.a)} и ${esc(state.names.b)}</p><h1 tabindex="-1">Ваше пространство.</h1><p class="lead">Сегодня достаточно одного маленького шага друг к другу.</p></div><span class="pill">${state.paidStage?`Демонстрационный этап ${state.paidStage}`:"Бесплатное знакомство"}</span></section>
    <div class="dashboard"><section class="today panel"><p class="eyebrow">Сегодня для нас</p><h2>${next?esc(next.title):"Вы попробовали три встречи."}</h2><p>${next?esc(next.prompt):"В рабочем продукте здесь появится первый этап платной программы."}</p><p class="quiet">${next?esc(next.time):"Подписка откроет новые встречи для обоих"}</p>${next?button("Открыть встречу →","activity",`data-id="${next.id}"`):button("Посмотреть наш год →","view","data-view=\"roadmap\"")}</section>
    <aside class="panel soft"><p class="eyebrow">Наша история</p>${cover(true)}<p>${D.materials(state).length} выбранных материалов</p>${button("Посмотреть черновик →","view","data-view=\"history\"",true)}</aside></div>
    <section class="section"><div class="section-head"><h2>Наши встречи</h2><p class="quiet">${state.completed.length} из 3 вводных встреч завершено</p></div><div class="three">${D.cards.map(c=>`<article class="panel"><span class="eyebrow">${esc(c.time)}${state.completed.includes(c.id)?" · завершена":""}</span><h3>${esc(c.title)}</h3><p>${esc(c.hint)}</p>${button(state.completed.includes(c.id)?"Вернуться к ответам":"Открыть →","activity",`data-id="${c.id}"`,true)}</article>`).join("")}</div></section>`;
  }
  function activity() {
    const c=D.cards.find(c=>c.id===cardId), answers=D.visible(state,cardId,actor), own=answers[actor], reveal=D.revealed(state,cardId);
    const answerForm=`<form id="answer-form"><label for="answer">Ваш ответ, ${esc(state.names[actor])}</label><textarea id="answer" name="answer" maxlength="1200" rows="5" required>${esc(own??"")}</textarea><p class="quiet">До ответа партнёра текст видите только вы. Это демонстрация поведения интерфейса.</p><button class="button" type="submit">${own?"Сохранить изменения":"Отправить ответ →"}</button></form>`;
    return `<section class="section narrow"><p class="eyebrow">${esc(c.time)} · Вводная встреча</p><h1 tabindex="-1">${esc(c.title)}</h1><p class="question">${esc(c.prompt)}</p><p>${esc(c.hint)}</p>${actor==="b"&&!state.joined?`<div class="panel"><p>Сначала примите приглашение в пространство.</p>${button("Принять приглашение","join")}</div>`:reveal?`<div class="answers">${["a","b"].map(a=>`<article class="panel"><p class="eyebrow">${esc(state.names[a])}</p><p class="answer-text">${esc(answers[a])}</p>${a===actor?button(state.selections[cardId+":"+a]?"Убрать из книги":"Выбрать для книги","select","",true):""}</article>`).join("")}</div><div class="ritual"><p class="eyebrow">Теперь вместе</p><p>${esc(c.action)}</p>${button(state.completed.includes(cardId)?"Встреча завершена ✓":"Мы сделали это →","complete")}</div><details><summary>Изменить свой ответ</summary>${answerForm}</details>`:own?`<div class="panel"><p class="eyebrow">Ваш ответ сохранён</p><p class="answer-text">${esc(own)}</p><h3>Ждём ответ ${actor==="a"?"Алексея":"Анны"}.</h3><p>Ответы откроются, когда оба будут готовы.</p>${button("Переключиться на партнёра →","switch",`data-actor="${actor==="a"?"b":"a"}"`,"secondary")}</div><details><summary>Изменить ответ</summary>${answerForm}</details>`:answerForm}<div class="actions">${button("Вернуться в пространство","view","data-view=\"home\"",true)}${button("Вернуться позже","skip","",true)}</div></section>`;
  }
  function history() {
    const entries=D.materials(state), approved=state.approvals[actor]===state.revision;
    return `<section class="section"><p class="eyebrow">Наша история</p><h1 tabindex="-1">Книга, в которой вы.</h1><p class="lead">Выбирайте свои ответы после совместного раскрытия. Перед сохранением оба участника одобряют одну и ту же версию.</p><div class="book-layout"><aside>${cover()}<p class="quiet">Демонстрационный черновик · версия ${state.revision}</p></aside><div>${entries.length?entries.map(e=>`<article class="book-page"><span class="eyebrow">${esc(e.name)}</span><h3>${esc(e.prompt)}</h3><p class="answer-text">${esc(e.text)}</p></article>`).join(""):`<div class="panel"><h3>Первые страницы впереди.</h3><p>Пройдите встречу, раскройте ответы и выберите свой материал для книги.</p>${button("Открыть первую встречу →","activity",`data-id="${D.cards[0].id}"`)}</div>`}
    <div class="approval panel"><h3>Согласование книги</h3><p>${["a","b"].map(a=>`${esc(state.names[a])}: ${state.approvals[a]===state.revision?"одобрено":"ожидает одобрения"}`).join(" · ")}</p><p class="quiet">${state.paidStage<3?"Предварительные страницы доступны сейчас. Согласование итоговой книги — после третьего оплаченного этапа.":"Для проверки используйте переключатель участников сверху."}</p><div class="actions">${button(approved?"Вы одобрили эту версию ✓":"Одобрить текущую версию","approve",`${approved||state.paidStage<3||!entries.length?"disabled":""}`)}${button("Печать черновика / PDF","print",`${D.canPrint(state)?"":"disabled"}`,true)}</div><p class="quiet">В прототипе используется печать браузера. Серверная генерация PDF будет отдельной задачей.</p></div></div></div></section>`;
  }
  function roadmap() {
    return `<section class="section"><p class="eyebrow">Двенадцать глав</p><h1 tabindex="-1">Наш год вдвоём.</h1><p class="lead">Каждый этап даёт свой результат. Здесь показана концепция года; готовность заданий и оплат не моделируется.</p><div class="roadmap">${phases.map(([title,reward],i)=>`<article class="road-row"><span class="month">${String(i+1).padStart(2,"0")}</span><div><h3>${esc(title)}</h3><p>${esc(reward)}</p></div><span class="quiet">${i<6?"Редакционный план":"Концепция"}</span></article>`).join("")}</div></section>`;
  }
  function render() {
    document.getElementById("actor-a").setAttribute("aria-pressed",String(actor==="a"));
    document.getElementById("actor-b").setAttribute("aria-pressed",String(actor==="b"));
    const stageSelect=document.getElementById("demo-stage"); stageSelect.value=String(state.paidStage); stageSelect.disabled=!state.created;
    root.innerHTML=nav()+({landing,home,activity,history,roadmap}[view])();
  }
  function show(message,isError=false) {notice.textContent=message; notice.setAttribute("role",isError?"alert":"status");}
  function navigate(next) { view=next; render(); root.querySelector("h1")?.focus({preventScroll:true}); window.scrollTo({top:0,behavior:"instant"}); }
  function printBook() {
    if(!D.canPrint(state)) throw Error("Книгу должны одобрить оба участника.");
    document.getElementById("print-book").innerHTML=`<div class="print-cover">${cover()}</div>`+D.materials(state).map(e=>`<section class="print-page"><p class="eyebrow">${esc(e.name)}</p><h2>${esc(e.prompt)}</h2><p class="answer-text">${esc(e.text)}</p></section>`).join("");
    window.print();
  }
  document.addEventListener("click",event=>{
    const el=event.target.closest("[data-action]"); if(!el||el.disabled)return;
    show("");
    try {
      const action=el.dataset.action;
      if(action==="create"){state=D.create(state);actor="a";navigate("home");}
      else if(action==="sample"){document.querySelector(".sample")?.scrollIntoView({behavior:"instant"});}
      else if(action==="switch"){actor=el.dataset.actor;render();show(`Вы смотрите демо от лица ${actor==="a"?"Анны":"Алексея"}.`);}
      else if(action==="join"){state=D.join(state);navigate("home");}
      else if(action==="view"){navigate(el.dataset.view);}
      else if(action==="activity"){cardId=el.dataset.id;navigate("activity");}
      else if(action==="complete"){state=D.complete(state,cardId);render();show("Встреча завершена. Можно сохранить свои ответы в книгу.");}
      else if(action==="select"){state=D.select(state,cardId,actor);render();show("Выбор обновлён. Предыдущие одобрения книги сброшены.");}
      else if(action==="approve"){state=D.approve(state,actor);render();show("Вы одобрили текущую версию.");}
      else if(action==="print"){printBook();}
      else if(action==="skip"){navigate("home");show("Можно вернуться позже. Ваши ответы сохранены до перезагрузки демо.");}
      else if(action==="reset"){state=D.initial();actor="a";cardId=D.cards[0].id;navigate("landing");show("Демонстрация начата заново.");}
    }catch(e){show(e.message,true);}
  });
  document.addEventListener("submit",event=>{
    if(event.target.id!=="answer-form")return;event.preventDefault();
    try{state=D.submit(state,cardId,actor,new FormData(event.target).get("answer"));render();show("Ответ сохранён.");}catch(e){show(e.message,true);}
  });
  document.getElementById("demo-stage").addEventListener("change",event=>{
    try{state=D.stage(state,Number(event.target.value));render();show("Это только переключение этапа демо, без оплаты.");}catch(e){show(e.message,true);}
  });
  render();
})();</script></body></html>
