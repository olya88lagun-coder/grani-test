name: together-prototype
on:
  push:
    branches: [feat/together-prototype]
    paths:
      - docs/together/**
      - .github/workflows/together-prototype.yml
  pull_request:
    paths:
      - docs/together/**
      - .github/workflows/together-prototype.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node docs/together/verify.mjs
      - run: node docs/together/verify-materials.mjs
      - run: node docs/together/verify-quarter.mjs
