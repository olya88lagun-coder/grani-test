name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grani-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Check deploy configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deployment secrets are not configured yet; deployment will be skipped."
          fi

      - name: Configure SSH
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy web and worker
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          expected_tag="sha-${GITHUB_SHA:0:7}"
          remote_script="$(mktemp)"
          trap 'rm -f "$remote_script"' EXIT
          cat > "$remote_script" <<'REMOTE'
          set -euo pipefail
          EXPECTED_TAG="${1:?expected tag is required}"
          cd /opt/grani
          owner="$(grep -E '^GHCR_OWNER=' .env | cut -d= -f2)"
          targets=(web worker migrate)

          # images.yml собирает три образа параллельно — ждём, пока появятся все с тегом этого коммита
          for target in "${targets[@]}"; do
            image="ghcr.io/$owner/grani-$target"
            for attempt in $(seq 1 60); do
              if docker pull -q "$image:$EXPECTED_TAG" >/dev/null; then
                break
              fi
              if [[ "$attempt" -eq 60 ]]; then
                echo "Expected image $image:$EXPECTED_TAG was not published in time." >&2
                exit 1
              fi
              sleep 10
            done
            docker tag "$image:$EXPECTED_TAG" "$image:latest"
          done

          # Миграции не откатываются — перед ними копия базы; хранятся пять последних
          mkdir -p backups
          docker exec food-tracker-bot-db-1 pg_dump -U food_tracker -d grani --no-owner | gzip > "backups/pre-$EXPECTED_TAG.sql.gz"
          ls -1t backups/pre-*.sql.gz | tail -n +6 | xargs -r rm -f

          # Скрипт приходит на сервер через stdin (bash -s). Без -T и </dev/null compose run
          # дочитает остаток скрипта как свой ввод, и bash молча завершится после миграции.
          docker compose run --rm -T migrate </dev/null
          docker compose up -d --force-recreate web worker

          for attempt in $(seq 1 30); do
            health="$(docker inspect -f '{{.State.Health.Status}}' grani-web-1 2>/dev/null || true)"
            if [[ "$health" == "healthy" ]]; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "grani-web-1 did not become healthy in time." >&2
              docker inspect -f '{{json .State.Health}}' grani-web-1 || true
              exit 1
            fi
            sleep 3
          done

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          site=https://grani-test.ru

          curl -fsS "$site/" > "$tmp/home.html"
          curl -fsS "$site/types/iskra" > "$tmp/iskra.html"
          curl -fsS "$site/compatibility" > "$tmp/compatibility.html"
          curl -fsS "$site/contacts" > "$tmp/contacts.html"
          curl -fsS "$site/articles/big-five" > "$tmp/article.html"
          curl -fsS "$site/test" > "$tmp/test.html"
          curl -fsS "$site/sitemap.xml" > "$tmp/sitemap.xml"
          curl -fsS "$site/robots.txt" > "$tmp/robots.txt"

          assert_contains() {
            local needle="$1"
            local file="$2"
            local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "SMOKE TEST FAILED: $label"
              echo "Expected: $needle"
              case "$file" in
                *.html) grep -o '<title>[^<]*</title>' "$file" | head -1 || true ;;
                *) head -c 2000 "$file" || true; echo ;;
              esac
              exit 1
            fi
          }

          assert_status() {
            local expected="$1"
            local label="$2"
            shift 2
            local status
            status="$(curl -s -o /dev/null -w '%{http_code}' "$@")"
            if [[ ! " $expected " == *" $status "* ]]; then
              echo "SMOKE TEST FAILED: $label — got $status, expected one of: $expected"
              exit 1
            fi
          }

          assert_contains '<title>Грани — тест личности: 16 типов и как тебя видят другие</title>' "$tmp/home.html" "home title"
          assert_contains 'rel="canonical" href="https://grani-test.ru"' "$tmp/home.html" "home canonical"
          assert_contains 'name="yandex-verification"' "$tmp/home.html" "home yandex verification"
          assert_contains 'content="index, follow"' "$tmp/home.html" "home indexable"
          assert_contains 'rel="canonical" href="https://grani-test.ru/types/iskra"' "$tmp/iskra.html" "type canonical"
          assert_contains '"@type":"BreadcrumbList"' "$tmp/iskra.html" "type breadcrumbs"
          assert_contains 'Тест на совместимость пары' "$tmp/compatibility.html" "compatibility heading"
          assert_contains 'ИНН' "$tmp/contacts.html" "contacts INN"
          assert_contains '"@type":"Article"' "$tmp/article.html" "article JSON-LD"
          assert_contains 'noindex' "$tmp/test.html" "test page is not indexed"
          assert_contains 'https://grani-test.ru/types/nablyudatel' "$tmp/sitemap.xml" "sitemap type page"
          assert_contains 'https://grani-test.ru/articles/big-five' "$tmp/sitemap.xml" "sitemap article"
          assert_contains 'Sitemap: https://grani-test.ru/sitemap.xml' "$tmp/robots.txt" "robots sitemap"
          assert_contains 'Disallow: /result/' "$tmp/robots.txt" "robots private pages"

          # Уведомление не с IP ЮKassa отклоняется (403), а без ключей ЮKassa маршрута нет (404)
          assert_status "403 404" "yookassa notification from a foreign IP" -X POST "$site/api/yookassa/notification" -d '{}'
          assert_status "404" "fake payments are off in production" "$site/dev/pay/x"
          assert_status "404" "dev login is off in production" "$site/api/dev/login"

          if ! docker logs --since 5m grani-worker-1 2>&1 | grep -q '"worker started"'; then
            echo "SMOKE TEST FAILED: worker did not start"
            docker logs --since 5m grani-worker-1 2>&1 | tail -20 || true
            exit 1
          fi

          echo "Deployment and smoke tests passed."

          # Диск общий с трекером и wishlist: оставляем текущий релиз и один предыдущий для отката
          for target in "${targets[@]}"; do
            image="ghcr.io/$owner/grani-$target"
            mapfile -t old_tags < <(
              docker images "$image" --format '{{.CreatedAt}}\t{{.Tag}}' |
                sort -r |
                awk -F '\t' -v current="$EXPECTED_TAG" '$2 ~ /^sha-/ && $2 != current {print $2}' |
                tail -n +2
            )
            for tag in "${old_tags[@]}"; do
              docker rmi "$image:$tag" >/dev/null || echo "Could not remove $image:$tag" >&2
            done
          done
          docker image prune -f --filter "until=24h" >/dev/null || true
          df -h / | awk 'NR == 2 {print "Disk usage: " $3 " of " $2 " (" $5 ")"}'
          REMOTE

          ssh_args=(
            -i ~/.ssh/deploy_key
            -4
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=3
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
          )

          # Код 255 — сбой самого SSH-соединения: повторяем; любой другой код — результат скрипта
          for ssh_attempt in 1 2 3; do
            set +e
            ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$expected_tag'" < "$remote_script"
            ssh_rc=$?
            set -e

            if [[ "$ssh_rc" -eq 0 ]]; then
              exit 0
            fi

            if [[ "$ssh_rc" -ne 255 || "$ssh_attempt" -eq 3 ]]; then
              exit "$ssh_rc"
            fi

            echo "SSH connection failed (exit 255); retrying in 5 seconds (attempt $((ssh_attempt + 1))/3)." >&2
            sleep 5
          done
